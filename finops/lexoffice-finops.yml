meters:
- name: user_seats
  description: Per-user monthly subscription seats, the primary cost driver, billed per plan tier.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: plan_tier
  description: Subscription tier (S / M / L / XL) selected for the account, setting the per-seat rate.
  unit: tier
  aggregation: max
  dimensions:
  - account
- name: api_calls
  description: Public REST API calls; included in the subscription and not separately billed (bounded by the 2 rps rate limit).
  unit: requests
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track active user seats and the chosen plan tier per account; API calls are unpriced but should be monitored against the 2 rps limit to avoid throttling.
- name: Allocation
  description: Map subscription seats to teams/entities; a single lexoffice organization equals one billing account.
- name: Optimization
  description: Right-size the plan tier to the features actually used and deactivate unused seats; do not over-provision to a higher tier for API access, since the API is included on paid plans.
- name: Accountability
  description: Review the monthly subscription invoice against active seats and verify promotional pricing has not lapsed to full rate unexpectedly.
