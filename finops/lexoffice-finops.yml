description: >-
  FinOps view of lexoffice (lexware Office) spend. lexoffice is a per-user,
  per-month SaaS subscription billed monthly in EUR (net of German VAT), with no
  minimum contract term. Cost is driven almost entirely by the plan tier (S / M /
  L / XL) and the number of user seats - not by API consumption. The public REST
  API is included in the subscription and is not separately metered or billed per
  call; the effective governor on API cost is the flat per-seat subscription plus
  the 2 requests/second rate limit. There are no usage-based API overage charges
  documented. Per-unit rates are not reconciled here.
notes: >-
  Because the API has no per-call price, API-related FinOps for lexoffice is about
  right-sizing seats and plan tier rather than metering calls. Verify current
  per-seat rates and any promotional pricing on the Lexware pricing page during
  reconciliation. Prices are net of 19% German VAT.
