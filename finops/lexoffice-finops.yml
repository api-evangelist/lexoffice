billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: EUR
  chargeCategories:
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: lexware Office
  ServiceCategory: Accounting and Invoicing Software
  ProviderName: Lexware
  PublisherName: Lexware
  InvoiceIssuerName: Lexware
