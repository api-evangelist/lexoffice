aid: lexoffice
name: lexoffice
review:
  question: Does lexoffice expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. lexoffice's public API is request/response
    REST over HTTPS. It does offer asynchronous change notifications, but these are
    delivered as outbound HTTP webhooks (event subscriptions): the client registers
    an HTTPS callbackUrl and lexoffice POSTs a small JSON payload to it when a
    subscribed event fires. There is no server-push streaming transport on
    lexoffice's own API - no WebSocket and no Server-Sent Events stream - to model
    in AsyncAPI. Webhook callbacks are server-to-endpoint HTTP requests, not a
    persistent bidirectional connection.
findings:
  summary: |
    lexoffice (rebranded to "lexware Office" in 2025) does not publish a documented
    public WebSocket API. It is a German cloud accounting/invoicing SaaS from
    Lexware (Haufe Group). Its public API is a pure request/response REST API over
    HTTPS. The base URL is https://api.lexware.io/v1 (the gateway moved from
    https://api.lexoffice.io on 26 May 2025 as part of the rebrand; the legacy host
    remained available through December 2025). Authentication is a self-serve
    Bearer API key generated by the account owner at
    https://app.lexware.de/addons/public-api. The API is rate limited to 2 requests
    per second per client (HTTP 429 on exceed). Asynchronous notifications are
    delivered by event subscriptions (webhooks) - the client registers an HTTPS
    callbackUrl and lexoffice POSTs a JSON payload when a subscribed event occurs.
    No realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint is
    documented anywhere in the lexoffice / Lexware API reference as of the review
    date.
  accessModel: |
    Self-serve. Any lexoffice / lexware Office customer on a paid plan can generate
    a private API key from the Public API add-on in the web app and call the API
    immediately - there is no partner application, OAuth client registration, or
    sales gate for the standard REST API. The key is a long-lived Bearer token.
  rebrandNote: |
    lexoffice was rebranded to "lexware Office" in 2025. The product, app, and API
    gateway domains migrated from lexoffice.io / lexoffice.de to lexware.io /
    lexware.de. The developer portal now lives at https://developers.lexware.io/
    (developers.lexoffice.io redirects there) and the API host is
    https://api.lexware.io. This entry keeps the folder slug/aid "lexoffice" for
    catalog continuity while naming the rebrand honestly.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.lexware.io/v1
      documented: true
      note: All documented endpoints are HTTPS REST. Legacy base https://api.lexoffice.io/v1 was retired end of 2025.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Event subscriptions POST a JSON payload to a client-registered HTTPS callbackUrl. Outbound server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the lexoffice / Lexware API reference as of the review date.
  endpointsConfirmedRest:
