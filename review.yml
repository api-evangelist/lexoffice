  endpointsModeled:
    - note: >-
        The OpenAPI request/response schemas (Contact, Invoice, SalesDocument,
        Voucher, EventSubscription, Payments, etc.) are hand-authored
        representative models grounded in the public documentation, not the
        vendor's own machine-readable specification. Field sets are accurate to the
        documented shape but are a solid subset, not exhaustive. The exact
        eventType enumeration and some optional sub-objects are summarized. Verify
        against https://developers.lexware.io/docs/ before production use.
sources:
  - url: https://developers.lexware.io/docs/
    type: Documentation
    note: Current Lexware API reference; base https://api.lexware.io, Bearer API key, 2 req/sec rate limit, full endpoint list.
  - url: https://developers.lexoffice.io/
    type: Documentation
    note: Legacy lexoffice developer portal; 301-redirects to developers.lexware.io.
  - url: https://app.lexware.de/addons/public-api
    type: Signup
    note: Where account owners generate a private API key (self-serve).
  - url: https://www.lexware.de/lexware-office/
    type: Website
    note: Product page for lexware Office (formerly lexoffice).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. lexoffice's own public API is
    request/response REST plus outbound HTTP webhooks (event subscriptions). No
    AsyncAPI document was created because there is no server-push streaming
    transport (WebSocket or SSE) on lexoffice's own API to model; asynchronous
    notifications are delivered as one-shot HTTP callbacks to a client endpoint.
