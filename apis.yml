- aid: lexoffice:lexoffice-event-subscriptions-api
  name: lexoffice Event Subscriptions API
  tags:
  - Webhooks
  - Event Subscriptions
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
