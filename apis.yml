    type: APIReference
  - url: openapi/lexoffice-openapi.yml
    type: OpenAPI
  - url: collections/lexoffice.opencollection.json
    type: OpenCollection
  description: Subscribe to change events (e.g. contact.created, invoice.created)
    by registering an HTTPS callback URL. lexoffice POSTs a webhook payload to your
    callback when a subscribed event fires. Create, list, retrieve, and delete
    subscriptions. Server-to-endpoint HTTP callbacks, not a WebSocket.
