aid: lexoffice
url: https://raw.githubusercontent.com/api-evangelist/lexoffice/refs/heads/main/apis.yml
name: lexoffice
kind: company
description: lexoffice (rebranded to "lexware Office" in 2025) is a German cloud
  accounting, invoicing, and bookkeeping SaaS from Lexware (Haufe Group). Its public
  REST API lets developers push and pull business data - contacts, invoices,
  quotations, order confirmations, delivery notes, credit notes, dunnings,
  bookkeeping vouchers, files, payments, and profile metadata - and subscribe to
  webhooks via event subscriptions. Authentication is a self-serve Bearer API key.
  The API gateway moved from api.lexoffice.io to api.lexware.io on 26 May 2025 as
  part of the rebrand; the legacy host remained available through December 2025.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/lexoffice.png
tags:
- Accounting
- Invoicing
- Bookkeeping
- Finance
- Germany
